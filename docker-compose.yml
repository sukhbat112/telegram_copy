# Full local stack: Postgres + Redis + the API server + the nginx-served client.
#
#   docker compose up --build        -> everything, app at http://localhost:8080
#   docker compose up -d db redis    -> just the infra (for local `npm run dev`)
#
# Values come from a root .env file (see .env.example); defaults are baked in
# below so it also runs with no .env at all.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-telegram}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-telegram}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-telegram}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-prod}
      CLIENT_ORIGIN: http://localhost:8080
    # Wait until the database and cache are actually ready before starting.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  db-data:
